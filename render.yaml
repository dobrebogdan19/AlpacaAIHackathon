# Render Blueprint — https://render.com/docs/blueprint-spec
#
# One free-tier web service running the FastAPI app + dashboard.
#
# Free tier notes:
#   * The service spins down after ~15 min of inactivity; the next request
#     cold-starts it (a few seconds). This is accepted for the demo.
#   * Free instances CANNOT mount a persistent disk. DB_PATH therefore points at
#     /tmp, which is wiped on every cold start — so on each start api.py
#     re-seeds it from the committed seed.db (api._bootstrap_db). The dashboard
#     always shows the full seeded record; cycles run via POST /api/cycle
#     persist only until the next spin-down.
#   * To get real persistence, upgrade this service to a paid instance type and
#     uncomment the `disk:` block below (and set DB_PATH to /var/data/trading.db).
#
# Secrets (ALPACA_API_KEY, ALPACA_SECRET_KEY, OPENAI_API_KEY) are marked
# `sync: false` — Render prompts for them in the dashboard on first deploy and
# never stores them in this file.

services:
  - type: web
    name: alpaca-self-audit
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    # Python version comes from the .python-version file (3.13) — Render fills in
    # the latest patch. (PYTHON_VERSION as an env var would need a full x.y.z.)
    envVars:
      - key: DB_PATH
        value: /tmp/trading.db
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # DRY_RUN is intentionally unset — live paper orders through the MCP path.

      # --- T5.3: autonomous operation for the hackathon window ----------------
      # The scheduler runs generate->gate->execute a couple of times per trading
      # day and an option-position exit sweep every tick. See scheduler.py.
      #
      # Halted 2026-08-31 after the D58 incident (a /tmp wipe made risk.py blind
      # to open positions and made the scheduler re-run an entry cycle it had
      # already done). Re-enabled the same day once BROKER_TRUTH was verified on
      # the deployed instance: a restart reconstructed all 9 positions, a manual
      # cycle blocked every promotion at "9 >= 8", and the probe confirmed
      # entry_due:false from broker order history (no catch-up). See DECISIONS D58.
      - key: SCHEDULER_ENABLED
        value: "1"
      # Fresh dedicated hackathon paper account: no seed history, reconcile
      # order/position state from the account on startup (reconcile.py).
      - key: SKIP_SEED_BOOTSTRAP
        value: "1"
      # D58: the free tier wipes the /tmp DB on every restart. With this on,
      # risk.py measures its ceilings against the BROKER (positions + working
      # orders), reconcile.py rebuilds lost order rows from the broker on boot,
      # and the scheduler reads "when did we last trade?" from broker order
      # history — so a wipe can no longer make the agent trade blind or re-run a
      # cycle it already did. Off in tests / local dev (local rows only).
      - key: BROKER_TRUTH
        value: "1"
      # Gate recalibrated for a four-day live window (D50): only min_trades moves
      # (10 -> 3). The strict default stays in gate.py for the historical seed.
      - key: GATE_MIN_TRADES
        value: "3"

      # --- D53: risk caps widened for the competition window --------------------
      # The strict caps in risk.py (3 positions / $2,500 option premium) were set
      # in Phase 3 for an equity project with no P&L criterion. P&L is the
      # hackathon's first judging criterion and judges inspect the account
      # directly, so a cap that idles the agent after 3 positions is wrong for
      # this context. 8 positions and $8,000 premium ~= 8% of a $100k account.
      # Kill switch, the $2,000 notional ceiling and the 5-contracts-per-position
      # cap are unchanged. Defaults stay in risk.py for the seed lineage / tests.
      - key: RISK_MAX_CONCURRENT_POSITIONS
        value: "8"
      - key: RISK_MAX_OPTION_PREMIUM_AT_RISK
        value: "8000"
      # Breadth, not frequency, creates activity on daily bars (D53): a wider
      # candidate batch per entry cycle so the wider symbol universe is actually
      # sampled. 4 -> 8 LLM candidates (+ the hand-written seeds).
      - key: SCHEDULER_CYCLE_N
        value: "8"

      # Optional overrides (defaults shown): SCHEDULER_TICK_S=600 (10 min),
      # SCHEDULER_ENTRY_INTERVAL_MIN=180 (3 h).

    # NOTE: point an external uptime pinger at /api/health every ~10 min during
    # US market hours — the free instance sleeps after ~15 min idle and a
    # background thread is not inbound traffic. Gaps are logged either way.

    # --- uncomment on a PAID instance for a real persistent database ----------
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
    # (and change DB_PATH above to /var/data/trading.db)
