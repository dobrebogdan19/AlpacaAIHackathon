# D59 — persist the DB the free tier keeps wiping.
#
# Render's free tier has no disk: /tmp/trading.db is lost on every restart.
# reconcile.py rebuilds positions and orders from the broker (D58), but backtests,
# the decision log, run history and scheduler ticks have no broker equivalent.
#
# This job pulls a consistent gzipped copy from GET /api/db-snapshot every ~30 min
# and force-pushes it to the orphan `snapshots` branch as a single commit. On
# boot, api._restore_from_snapshot() pulls that raw file and loads it IFF the
# local DB is empty — so a snapshot never overwrites newer live data.
#
# No card, no external account: GitHub Actions on a public repo, GITHUB_TOKEN only.

name: DB history snapshot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: db-snapshot
  cancel-in-progress: false

env:
  SNAPSHOT_ENDPOINT: https://alpaca-self-audit.onrender.com/api/db-snapshot

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (for the secret-scan script)
        uses: actions/checkout@v4

      - name: Pull the DB snapshot from the live instance
        run: |
          curl -fsSL --retry 4 --retry-delay 20 --retry-all-errors \
               --connect-timeout 30 --max-time 180 \
               -o new.db.gz "$SNAPSHOT_ENDPOINT"
          ls -l new.db.gz

      - name: Validate — gzipped SQLite, openable
        run: |
          gzip -t new.db.gz
          gzip -dc new.db.gz > new.db
          head -c 16 new.db | grep -q "SQLite format 3" || { echo "::error::not a SQLite file"; exit 1; }
          python3 - <<'PY'
          import sqlite3
          n = sqlite3.connect("new.db").execute("SELECT COUNT(*) FROM runs").fetchone()[0]
          print(f"snapshot has {n} run(s)")
          PY

      - name: Scan for secrets (fails the job if anything key-shaped is found)
        run: python3 .github/scripts/scan_snapshot.py new.db

      - name: Publish to the snapshots branch
        run: |
          rm -f new.db
          repo="${GITHUB_REPOSITORY}"
          if curl -fsSL -o cur.db.gz \
               "https://raw.githubusercontent.com/${repo}/snapshots/trading.db.gz" \
             && cmp -s cur.db.gz new.db.gz; then
            echo "snapshot byte-identical to the published one — nothing to do"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cat > README.md <<'EOF'
          # DB history snapshots

          Auto-generated by `.github/workflows/db-snapshot.yml`. One gzipped copy of
          the live instance's SQLite database, refreshed about every 30 minutes,
          because the Render free tier wipes the database on every restart
          (DECISIONS.md D58 / D59).

          `api._restore_from_snapshot()` loads `trading.db.gz` on boot **only when
          the app's own database is empty**, so a snapshot never overwrites newer
          live data. This branch is force-pushed to a single commit each run — do
          not merge it.
          EOF

          mv new.db.gz trading.db.gz
          git checkout --orphan snapshots
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f trading.db.gz README.md
          git commit -m "DB snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f origin snapshots
